spring.application.name=Laboratorio1

server.port = 9001

# Configurar la coneccion a la base de datos
spring.datasource.url = jdbc:mysql://localhost:3306/LABPOOII
spring.datasource.username = poo
spring.datasource.password = poo
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Indica si debe mostrar el log de las consultas sql ejecutadas
# Bueno a la hora de depurar
spring.jpa.show-sql= true

# Configurar Hibernate
spring.jpa.hibernate.ddl-auto= none
spring.data.jpa.repositories.enabled=true
